<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼덕이 휴방 체크</title>
<script>
  // 저장된 테마를 그리기 전에 적용해 깜빡임을 막는다
  try {
    const t = localStorage.getItem('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #77756e;
    --line: #e3e1d9;
    --on: #00b36b;
    --on-soft: #d6f5e6;
    --on-text: #00703f;
    --on-track: #b3e8cd;
    --off: #e5484d;
    --off-soft: #fde2e2;
    --pending: #b8b4a8;
    --none: #eeece6;
  }
  /* 기본(시스템)은 기기 설정을 따르고, 버튼으로 라이트/다크를 고르면 data-theme로 고정한다 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141413;
      --surface: #1e1e1c;
      --text: #ecebe6;
      --muted: #9a988f;
      --line: #2f2e2b;
      --on: #1fd286;
      --on-soft: #143a29;
      --on-text: #5ee8a8;
      --on-track: #22573f;
      --off: #ff6b6f;
      --off-soft: #3d1c1d;
      --pending: #6b685f;
      --none: #262523;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141413;
    --surface: #1e1e1c;
    --text: #ecebe6;
    --muted: #9a988f;
    --line: #2f2e2b;
    --on: #1fd286;
    --on-soft: #143a29;
    --on-text: #5ee8a8;
    --on-track: #22573f;
    --off: #ff6b6f;
    --off-soft: #3d1c1d;
    --pending: #6b685f;
    --none: #262523;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .theme {
    flex: none; display: grid; place-items: center; width: 40px; height: 40px; padding: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--text); cursor: pointer;
  }
  .theme svg { display: none; width: 20px; height: 20px; }
  :root:not([data-theme]) .theme .sys, :root[data-theme="light"] .theme .sun, :root[data-theme="dark"] .theme .moon { display: block; }
  header h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  header a { color: var(--muted); font-size: 14px; }

  .today {
    margin: 28px 0;
    padding: 24px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .today .label { color: var(--muted); font-size: 14px; }
  .today .verdict { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; margin: 4px 0; }
  .today .detail { color: var(--muted); font-size: 14px; }
  .today .stale { margin-top: 12px; font-size: 13px; color: var(--off); }
  .verdict.on { color: var(--on); }
  .verdict.off { color: var(--off); }
  .verdict.pending { color: var(--muted); }
  .live-dot {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    background: var(--off); margin-right: 8px; vertical-align: middle;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  .cal { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-head h2 { margin: 0; font-size: 18px; }
  .cal-head button {
    background: none; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; width: 36px; height: 36px; font-size: 16px; cursor: pointer;
  }
  .cal-head button:disabled { opacity: .3; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .dow { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
  .day {
    aspect-ratio: 1; border-radius: 10px; border: none; padding: 6px;
    display: flex; flex-direction: column; justify-content: space-between;
    font: inherit; font-size: 13px; text-align: left; color: var(--text);
    background: var(--none); cursor: pointer;
  }
  .day .mark { font-size: 11px; font-weight: 600; }
  .day.on { background: var(--on-soft); }
  .day.on .mark { color: var(--on); }
  .day .bar { display: block; height: 8px; border-radius: 4px; background: var(--on-track); overflow: hidden; }
  .day .bar i { display: block; height: 100%; border-radius: inherit; background: var(--on-text); }
  .day.off { background: var(--off-soft); }
  .day.off .mark { color: var(--off); }
  .day.pending { outline: 2px dashed var(--pending); outline-offset: -2px; background: transparent; }
  .day.unknown {
    background: repeating-linear-gradient(135deg, var(--none) 0 6px, transparent 6px 12px);
  }
  .day.unknown .mark { color: var(--muted); }
  .day.future, .day.blank { background: transparent; color: var(--muted); cursor: default; }
  .day.nodata { color: var(--muted); }
  .day.selected { outline: 2px solid var(--text); outline-offset: -2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }

  @media (max-width: 560px) {
    .cal { padding: 16px 10px; }
    .grid { gap: 4px; }
    .day { padding: 4px; border-radius: 8px; }
    .day .bar { height: 6px; border-radius: 3px; }
  }
  .tip {
    position: absolute; z-index: 10; width: max-content; max-width: 280px; pointer-events: none;
    padding: 10px 12px; border-radius: 10px; font-size: 13px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0, 0, 0, .15);
  }
  .tip ul, .info ul { margin: 6px 0 0; padding-left: 18px; }
  .tip li + li, .info li + li { margin-top: 6px; }
  .tip .muted { color: var(--muted); }

  .info { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; min-height: 24px; }
  .info .muted { color: var(--muted); }
  footer { margin-top: 24px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>삼덕이 오늘 방송함?</h1>
      <a href="https://chzzk.naver.com/86d3d8d5997609df783949d107fbde24" target="_blank" rel="noopener">치지직 채널 →</a>
    </div>
    <button class="theme" id="theme" type="button" aria-label="테마: 시스템" title="테마: 시스템">
      <svg class="sys" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <section class="today" id="today"><div class="label">불러오는 중…</div></section>
  <section class="stats" id="stats"></section>

  <section class="cal">
    <div class="cal-head">
      <button id="prev" aria-label="이전 달" disabled>‹</button>
      <h2 id="month"></h2>
      <button id="next" aria-label="다음 달" disabled>›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="tip" id="tip" role="tooltip" hidden></div>
    <div class="legend">
      <span><i style="background:var(--on-soft)"></i>방송 (막대: 방송 시간, 가득 차면 12시간)</span>
      <span><i style="background:var(--off-soft)"></i>휴방</span>
      <span><i style="outline:2px dashed var(--pending);outline-offset:-2px"></i>오늘 (아직 모름)</span>
      <span><i style="background:repeating-linear-gradient(135deg, var(--pending) 0 2px, transparent 2px 4px)"></i>확인 전</span>
      <span><i style="background:var(--none)"></i>기록 없음</span>
    </div>
    <div class="info" id="info"><span class="muted">날짜를 누르면 방송 정보를 볼 수 있어요.</span></div>
  </section>

  <footer id="footer"></footer>
</main>
<script type="module">
import { bindTheme, init } from './src/app.js';
// 테마 버튼이 실패해도 데이터는 그려지도록 init을 먼저 부른다
init();
bindTheme();
</script>
</body>
</html>
